name: OlaBall
options:
  bundleIdPrefix: co.nsgsolutions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  OlaBall:
    type: application
    platform: iOS
    sources: [OlaBall]
    info:
      path: OlaBall/Info.plist
      properties:
        CFBundleDisplayName: Spinola
        # Without these the generated Info.plist freezes literal 1.0/1 and bumping the build number
        # in the settings above silently does nothing - which bites on the SECOND upload, not the first.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: OlaBall/OlaBall.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nsgsolutions.spinola
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OlaBallTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OlaBallTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OlaBall
  OlaBallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OlaBallUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OlaBall
schemes:
  OlaBall:
    build:
      targets:
        OlaBall: all
        OlaBallTests: [test]
        OlaBallUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OlaBallTests, OlaBallUITests]
